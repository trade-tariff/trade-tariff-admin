name: Deploy to development full

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read
  id-token: write

jobs:
  deploy-full-stack:
    # Deploy only when a labeled event adds needs-full-deployment, not for other labels.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'needs-full-deployment') &&
       (github.event.action != 'labeled' || github.event.label.name == 'needs-full-deployment'))
    # Shares the group with deploy-to-development.yml because both deploy admin.
    # Only one run waits. A newer run cancels the waiting run. Re-run it if needed.
    concurrency:
      group: deploy-development-tariff-admin
      cancel-in-progress: false
    uses: trade-tariff/trade-tariff-tools/.github/workflows/deploy-multi-ecs.yml@main
    with:
      environment: development
      apps: |
        [
          {
            "name": "tariff-admin",
            "migrate": true,
            "service-names": ["admin"]
          },
          {
            "name": "tariff-backend",
            "repo": "trade-tariff/trade-tariff-backend",
            "migrate": true,
            "service-names": ["backend-uk", "backend-xi", "worker-uk", "worker-xi"]
          },
          {
            "name": "tariff-frontend",
            "repo": "trade-tariff/trade-tariff-frontend",
            "service-names": ["frontend"]
          },
          {
            "name": "tariff-identity",
            "repo": "trade-tariff/identity",
            "service-names": ["identity"]
          }
        ]
      test-flavour: tariff
      migrate: true
    secrets:
      ssh-key: ${{ secrets.PRIVATE_SSH_KEY }}
      slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
      basic-password: ${{ secrets.BASIC_PASSWORD }}
      waf_bypass_token: ${{ secrets.TF_VAR_WAF_E2E_SECRET_TOKEN }}
