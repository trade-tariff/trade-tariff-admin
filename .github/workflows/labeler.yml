name: "Label PRs"

on:
  - pull_request_target

# Run the labelling workflows one at a time. The labeler writes the full label list,
# so a parallel run removes a label that risk-label just added.
# Only one run waits. A newer run cancels the waiting run. Re-run it if needed.
concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  labeler:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Mint trade-tariff-pr-bot token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.TRADE_TARIFF_PR_BOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.TRADE_TARIFF_PR_BOT_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - uses: actions/labeler@v7.0.0
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
