# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more, please read the Rails Internationalization guide
# available at http://guides.rubyonrails.org/i18n.html.

en:
  time:
    formats:
      default: "%-d %B %Y %H:%M:%S %Z"
      short: "%-d %b %Y %H:%M %Z"
      tariff: "%d/%m/%Y %H:%M:%S %Z"

  date:
    formats:
      default: "%-d %M %Y"
      short: "%-d %m %Y"
      tariff: "%d/%m/%Y"

  activerecord:
    attributes:
      user:
        email: Email address
        name: Name

  helpers:
    service_update_type:
      xi: Taric
      uk: CDS
    label:
      rollback:
        date: Rollback to date
      section_note:
        section_title: Section title
      chapter_note:
        chapter_title: Chapter
      search_reference:
        title: Search reference
      news_item:
        start_date: Start date
        end_date: End date

    legend:
      rollback:
        keep: Keep update files?
        date: Rollback to date

      news_item:
        collection_ids: Show in News collections
        display_style: Pages to include on
        start_date: Start date
        end_date: End date

      live_issue:
        date_discovered: Date discovered
        date_resolved: Date resolved

    hint:
      rollback:
        keep: Keeps update files and records since specified date, and marks them as pending
        date: For example, 21 8 2026

      news_item:
        title: Not shown on frontend for Banner stories
        slug: Leave blank to automatically assign
        start_date: For example, 21 8 2026
        end_date: Leave blank for no end date
        chapters: Separate each 2-digit chapter with a comma e.g. 01, 39, 44 - or leave blank

      live_issue:
        commodities: Separate each 10 digit commodity code with a space e.g. 0101210000 0101300000. Leave blank if none are affected
        date_discovered: For example, 21 8 2026
        date_resolved: Leave blank if unresolved
        description: Provide a description of the issue. Aim for 256 characters or less
        suggested_action: Provide next steps for users. Aim for 256 characters or less

  activemodel:
    attributes:
      news/item:
        collection_ids: Collections
    errors:
      models:
        quota_search:
          attributes:
            order_number:
              not_a_number: Enter a valid quota order number
              wrong_length: Enter a valid quota order number
            import_date:
              invalid_date: Enter a valid date
        basic_session:
          attributes:
            password:
              inclusion: Incorrect password
        green_lanes/measure:
          attributes:
            productline_suffix:
              blank: Product Line Suffix cannot be blank
            goods_nomenclature_item_id:
              blank: Goods Nomenclature Item Id cannot be blank
        green_lanes/category_assessment_exemption:
          attributes:
            exemption_id:
              blank: Exemption cannot be blank
